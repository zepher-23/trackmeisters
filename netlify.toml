[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mailgun.js", "form-data"]

[dev]
  command = "npm run dev"
  targetPort = 3002
  port = 8888
  autoLaunch = false

# Redirect /api/* to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200


